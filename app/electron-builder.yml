# Empacotamento do aplicativo desktop.
#
# O app nao tem dependencia de runtime: o React e o Mermaid entram no bundle inline de
# `dist/index.html` e o processo principal so usa `node:` e `electron`. Por isso a lista
# de arquivos e explicita e nao ha `node_modules` dentro do pacote — o que tambem evita
# levar junto a pasta do launcher web que o `empacotar` deixa em `dist/`.

appId: br.roadmapciso.estudo
productName: Roadmap CISO
copyright: Roadmap CISO

directories:
  output: instalador

# So o que o aplicativo le em tempo de execucao. `main` do package.json aponta para
# dist-electron/main.cjs, que resolve `app.asar/dist` como raiz do esquema `app://`.
#
# `!node_modules/**` nao e economia de espaco por si: o React e o Mermaid ja estao dentro
# do bundle inline de `dist/index.html`, e o processo principal so usa `node:` e `electron`.
# Sem esta linha, o electron-builder arrasta a arvore de producao inteira — 7480 dos 7487
# arquivos do pacote, 137 MB dos 139 MB do AppImage, codigo que nunca e executado.
files:
  - package.json
  - dist-desktop/**/*
  - dist-electron/main.cjs
  - dist-electron/preload.cjs
  - '!node_modules/**'

# O codigo fica num arquivo so, e o `OnlyLoadAppFromAsar` (ver scripts/fuses.mjs) exige
# que ele exista.
asar: true

# Sem assinatura e sem auto-atualizacao: a distribuicao e uma pasta ou um instalador que
# a pessoa abre uma vez. Assinar e uma decisao separada (S14 do plano).
publish: null

# Endurecimento do binario: desliga o modo Node, o `NODE_OPTIONS` e a inspecao por
# argumento de linha de comando, exige o asar e liga a criptografia de cookie.
afterPack: scripts/fuses.mjs

mac:
  category: public.app-category.education
  # Sem assinatura: o Gatekeeper vai pedir "abrir mesmo assim" na primeira vez. Está
  # registrado como pendência — distribuir a terceiros exige a conta de desenvolvedor.
  identity: null
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  # Um clique: instala na pasta do usuário, sem pedir senha de administrador e sem
  # perguntas. É o público desta via — quem não tem conhecimento técnico.
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Roadmap CISO
  # A desinstalação também leva o `progresso.json`? Não: ele fica na pasta de dados do
  # aplicativo, fora da pasta de instalação.
  deleteAppDataOnUninstall: false

linux:
  category: Education
  synopsis: Estudo guiado para quem vai responder pela segurança da informação
  description: >
    Material de estudo com 18 áreas, 109 temas e três trilhas, com revisão espaçada,
    pré-teste, recuperação ativa e acompanhamento do progresso.
  # A identidade do app no ambiente grafico, e o que o aviso do empacotamento pedia.
  #
  # Sem isto o empacotamento avisa ("electron uses desktopName as app_id / WM_CLASS for window
  # association") e as tres identidades saem diferentes: o `.desktop` fica com o
  # `executableName` (medido: `roadmap-ciso-app.desktop`), o `StartupWMClass` com o `productName`
  # ("Roadmap CISO") e o app_id/WM_CLASS do Electron — que, sem `desktopName` no `package.json`,
  # cai num slug do nome do app (a doc do `app.setDesktopName` diz: `My App` -> `my-app.desktop`).
  # Sao tres nomes para a mesma janela, e o ambiente grafico casa a janela com a entrada pelo
  # nome: com os tres diferentes, o agrupamento na barra nao tem em que se apoiar.
  #
  # `desktopName` (no `package.json`) e o nome do ARQUIVO `.desktop` — com a extensao opcional —,
  # e o `syncDesktopName` e o que manda o empacotamento derivar o nome do arquivo DELE em vez de
  # usar o `executableName`. Fica o mesmo ID do `appId`, no formato reverso-DNS que o
  # `app.setDesktopName` documenta: e o `app_id` de verdade (Wayland e X11), e um id unico nao
  # colide com o `.desktop` de outro aplicativo.
  syncDesktopName: true
  # Só AppImage. O `.deb` saiu por decisão: ele depende do `fpm` do electron-builder, que
  # precisa de `libcrypt.so.1` — ausente no Fedora 44 e um pré-requisito de sistema para
  # gerar um pacote. O AppImage abre com duplo clique, que é o que esta via precisa.
  target:
    - target: AppImage
      arch: [x64]

# O sandbox do Chromium no Linux — o que foi MEDIDO nesta máquina, e o que o pacote faz.
#
# `stat -c '%a' instalador/linux-unpacked/chrome-sandbox` dá 755, e o binário DENTRO do AppImage
# também: o squashfs não sustenta setuid (medido: o ponto de montagem é FUSE, e `/proc/mounts`
# traz `ro,nosuid,nodev` nele) e o auxiliar precisaria de dono root + 4755 para valer — um
# AppImage de usuário não consegue nenhum dos dois. Forçar o 4755 sem o dono root é pior que não
# fazer nada: o Chromium ABORTA quando o auxiliar parece setuid e não está configurado.
#
# Sem o auxiliar, o Chromium cai no sandbox de user namespace, que funciona onde os namespaces
# não privilegiados existem. O que estragava era o `.desktop` gerado: com o toolset legado do
# AppImage (o padrão, `toolsets.appimage` ausente), o `AppImageTarget` punha
# `Exec=AppRun --no-sandbox %U` FIXO — e, com a flag já na linha de comando, o AppRun nem chega a
# fazer a própria conferência (`HAVE_NO_SANDBOX=1` pula o `unshare -Ur true`). O menu de
# aplicativos — que é a via deste público — entregava o app sem sandbox nenhum, sempre.
#
# O conserto é `appImage.executableArgs: []` (abaixo, na chave de alvo): o `.desktop` passa a ser
# `Exec=AppRun %U` e a decisão volta para o tempo de execução. MEDIDO, com o AppImage empacotado
# numa cópia isolada e aberto sem argumento nenhum (que é o que o `%U` vazio significa):
#   - `.desktop`: `Exec=AppRun --no-sandbox %U` (antes) -> `Exec=AppRun %U` (depois);
#   - o processo principal sobe SEM a flag e o renderer fica com `Seccomp: 2` e um namespace de
#     usuário próprio (`user:[…]` diferente do da sessão), com
#     `Activated seccomp-bpf sandbox for process type: renderer.` no log (`--v=1`);
#   - controle, no MESMO pacote com `--no-sandbox` na linha de comando (a via do `.desktop`
#     antigo): `Seccomp: 0`, namespace igual ao da sessão e nenhuma linha de sandbox no log;
#   - fail-safe conferido: com um `unshare` que falha no PATH (o que uma distro com user
#     namespaces restritos provoca), o AppRun ACRESCENTA `--no-sandbox` sozinho e o app sobe.
#
# O que NÃO foi medido: Ubuntu 24.04/AppArmor (`kernel.apparmor_restrict_unprivileged_userns`),
# onde o probe do AppRun falha e a flag volta — pelo fail-safe, não por esta config. Nesta
# máquina (Fedora 44) `unshare -Ur true` responde 0, `user.max_user_namespaces` é 126743 e
# `chrome-sandbox` é 755. O conserto definitivo continua sendo `.deb`/`.rpm`, onde a instalação
# aplica dono root + 4755 no auxiliar (bloqueado pelo `fpm` sem `libcrypt.so.1` no Fedora 44 —
# ver o bloco do `linux:` acima).
appImage:
  # Lista vazia, e não ausente: ausente é o que faz o `AppImageTarget` cair no `--no-sandbox`
  # fixo do toolset legado. É a decisão devolvida ao probe do AppRun.
  executableArgs: []
